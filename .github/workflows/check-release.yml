# scripts/release.ts runs this on a draft release for the platforms it compiles on GitHub (--host PLATFORM=gh): pix
# compiles the release's Pi on the platform it is for, that Pi passes bench/e2e, and it is uploaded to the draft.
name: check-release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
      platforms:
        description: JSON list of GOOS/GOARCH
        required: true
permissions:
  contents: write # a draft release is visible only with write access
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'macos-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: pix compile
        run: |
          p=$(echo "${{ matrix.platform }}" | tr / -)
          echo "P=$p" >> "$GITHUB_ENV"
          gh release download "${{ inputs.tag }}" --pattern "builder-$p" --pattern "pi-source-$p.tar.gz" --dir dl
          chmod +x "dl/builder-$p"
          "dl/builder-$p" compile --pi "$PWD/dl/pi-source-$p.tar.gz" --out "$RUNNER_TEMP/build"
      - name: bench/e2e
        run: |
          bun=$(ls -t ~/.cache/pix/runtime/*/bun ~/Library/Caches/pix/runtime/*/bun 2>/dev/null | head -1)
          "$bun" bench/e2e/run.ts "$RUNNER_TEMP/build/pi"
      - name: upload
        run: |
          tar -czf "pi-$P.tar.gz" -C "$RUNNER_TEMP/build" .
          gh release upload "${{ inputs.tag }}" "pi-$P.tar.gz"
