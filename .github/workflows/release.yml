# Releases the next version when a push to main changes pix: the patch after the latest release, or by hand
# (`gh workflow run release -f bump=minor`). The version goes into pix with -ldflags; the release creates its tag.
#
#   pi-source-<goos>-<goarch>.tar.gz  Pi from the pinned fork, patched, built and tested, with its runtime dependencies
#                                     (`pix self prepare`, once, on macOS); `pix compile` uses it
#   pi-<goos>-<goarch>.tar.gz         that Pi compiled with Bun (`pix compile --out`) on the platform it is for, where it
#                                     passes bench/e2e. install.sh and `pix update` download it: users compile nothing.
#   pix-<goos>-<goarch>               pix, with Bun inside (scripts/fetch-bun.sh) and the sums of the two above
#   install.sh                        what users and `pix update` run
#
# The release is published once everything is built and checked; then, on each platform, its install.sh installs it and
# the previous release updates to it with `pix update`. Never delete a release: an installed pix downloads its own release's assets for
# `pix compile`, and PIX_VERSION goes back to one.
name: release
on:
  push:
    branches: [main]
    paths: [cmd/**, internal/**, install.sh, go.mod, go.sum, scripts/fetch-bun.sh, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
# One release at a time; of the pushes made meanwhile, only the latest is released next.
concurrency: release
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare:
    runs-on: macos-latest
    outputs:
      tag: v${{ steps.version.outputs.version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: the next version
        run: |
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          IFS=. read -r major minor patch <<< "${prev#v}"
          case "${{ inputs.bump || 'patch' }}" in
          major) v=$((major + 1)).0.0 ;;
          minor) v=$major.$((minor + 1)).0 ;;
          *) v=$major.$minor.$((patch + 1)) ;;
          esac
          echo "$prev -> $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "LDFLAGS=-X github.com/iamdin/pix/internal/pix.Version=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sh scripts/fetch-bun.sh
      - name: checks
        run: |
          lock=internal/pix/data/sources.lock.json
          head=$(git ls-remote "$(jq -r .pi.repository $lock)" "refs/heads/$(jq -r .pi.branch $lock)" | cut -f1)
          test "$head" = "$(jq -r .pi.commit $lock)" || { echo "the Pi fork branch is at $head, not the pinned commit"; exit 1; }
          go vet ./...
          go test -count=1 ./...
      - name: prepare Pi, build the builders
        run: |
          go build -ldflags "$LDFLAGS" -o "$RUNNER_TEMP/pix" ./cmd/pix
          mkdir out
          for p in $(jq -r '.bun.platforms | keys[]' internal/pix/data/sources.lock.json); do
            n=$(echo "$p" | tr / -)
            "$RUNNER_TEMP/pix" self prepare --platform "$p" "$PWD/out/pi-source-$n.tar.gz"
            GOOS=${p%/*} GOARCH=${p#*/} go build -trimpath -ldflags "$LDFLAGS" -o "out/builder-$n" ./cmd/pix
          done
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          path: out

  compile:
    needs: prepare
    strategy:
      matrix:
        include:
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: linux-amd64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: dl
      - name: pix compile, bench/e2e
        run: |
          p=${{ matrix.platform }}
          chmod +x "dl/builder-$p"
          "dl/builder-$p" compile --pi "$PWD/dl/pi-source-$p.tar.gz" --out "$RUNNER_TEMP/build"
          # bench/e2e runs with the Bun that `pix compile` unpacked into its cache.
          bun=$(ls -t ~/.cache/pix/runtime/*/bun ~/Library/Caches/pix/runtime/*/bun 2>/dev/null | head -1)
          "$bun" bench/e2e/run.ts "$RUNNER_TEMP/build/pi"
          mkdir out
          tar -czf "out/pi-$p.tar.gz" -C "$RUNNER_TEMP/build" .
      - uses: actions/upload-artifact@v4
        with:
          name: pi-${{ matrix.platform }}
          path: out

  publish:
    needs: [prepare, compile]
    runs-on: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      LDFLAGS: -X github.com/iamdin/pix/internal/pix.Version=${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the previous release
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh scripts/fetch-bun.sh
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - name: build pix with the sums, publish
        run: |
          sum() { shasum -a 256 "$1" | cut -d' ' -f1; }
          mkdir out
          for p in $(jq -r '.bun.platforms | keys[]' internal/pix/data/sources.lock.json); do
            n=$(echo "$p" | tr / -)
            cp "dl/pi-$n.tar.gz" "dl/pi-source-$n.tar.gz" out/
            sums="pi-$n.tar.gz=$(sum out/pi-$n.tar.gz),pi-source-$n.tar.gz=$(sum out/pi-source-$n.tar.gz)"
            GOOS=${p%/*} GOARCH=${p#*/} go build -trimpath -ldflags "$LDFLAGS -X github.com/iamdin/pix/internal/pix.releaseSums=$sums" -o "out/pix-$n" ./cmd/pix
            (cd out && shasum -a 256 "pix-$n" > "pix-$n.sha256")
          done
          cp install.sh out/
          ls -l out
          # A draft until every asset is uploaded, so that nobody downloads a partial release.
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          git tag "$TAG" # locally, for the notes; the release creates it on GitHub
          sh scripts/release-notes.sh "$TAG" "$prev" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" out/* --draft --target "$GITHUB_SHA" --title "pix ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --draft=false --latest

  install:
    needs: [prepare, publish]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install with the release's install.sh
        run: |
          export PIX_INSTALL_DIR="$RUNNER_TEMP/new/bin" PIX_HOME="$RUNNER_TEMP/new/home"
          curl -fsSL "https://github.com/iamdin/pix/releases/download/$TAG/install.sh" | sh
          test "$("$PIX_INSTALL_DIR/pix" self version)" = "${TAG#v}"
          "$PIX_INSTALL_DIR/pix" --version
      - name: update from the previous release
        run: |
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 2 --json tagName -q '.[1].tagName')
          echo "updating from $prev"
          export PIX_INSTALL_DIR="$RUNNER_TEMP/old/bin" PIX_HOME="$RUNNER_TEMP/old/home"
          git fetch -q --depth 1 origin "refs/tags/$prev:refs/tags/$prev"
          git show "$prev:install.sh" | PIX_DOWNLOAD="https://github.com/iamdin/pix/releases/download/$prev" sh
          "$PIX_INSTALL_DIR/pix" --version
          "$PIX_INSTALL_DIR/pix" update
          "$PIX_INSTALL_DIR/pix" --version
          test "$("$PIX_INSTALL_DIR/pix" self version)" = "${TAG#v}"
          test "$(jq -r .pix "$PIX_HOME/current/pix-build.json")" = "${TAG#v}"
